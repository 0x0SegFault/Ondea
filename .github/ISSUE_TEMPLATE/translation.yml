name: Translation
description: Fix a translation or add a new language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Portuguese (Brazil)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: For a new language, you can directly open a pull request adding app/src/main/res/values-XX/strings.xml.
    validations:
      required: true
