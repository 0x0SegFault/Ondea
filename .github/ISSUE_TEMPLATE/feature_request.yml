name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need or problem first, then your idea.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Scientific source (if it changes predictions)
      description: Changes to the fertility algorithm need a peer-reviewed source or an established method (e.g. Sensiplan).
