name: Build & test

on:
  push:
    branches: [main]
  pull_request:

# Workflows (including ones from forks) only get read access to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Refuses to run a tampered Gradle wrapper (supply-chain protection).
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Build
        run: ./gradlew assembleDebug assembleRelease
      - name: Verify no internet permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions app/build/outputs/apk/release/*.apk | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found in the release APK" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: ondea-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
